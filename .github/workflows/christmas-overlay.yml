name: Build Nova Christmas Desktop

on:
  push:
    branches: [main]
    paths:
      - "NovaChristmasDesktop/**"
      - ".github/workflows/christmas-overlay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows x64 EXE
        run: dotnet publish NovaChristmasDesktop/NovaChristmasDesktop.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: NovaChristmasDesktop-Windows-x64
          path: NovaChristmasDesktop/bin/Release/net8.0-windows/win-x64/publish/
          if-no-files-found: error
          retention-days: 30
